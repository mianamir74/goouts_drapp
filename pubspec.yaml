name: goouts_drapp
description: GoOuts food delivery driver app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  firebase_storage: ^13.2.0
  provider: ^6.1.5+1
  go_router: ^17.1.0
  image_picker: ^1.2.1
  google_mlkit_face_detection: ^0.13.2
  # Live preview for the KYC selfie. The auto-capture + liveness ring read
  # frames from this; image_picker alone can only hand back a finished photo.
  camera: ^0.12.0+1
  # ADDED 24 Aug 2026 — this app had NO image package, so it had no way to
  # bake EXIF rotation into pixels. Its passports and selfies were being
  # stored sideways and failing the face check for that reason alone.
  image: ^4.1.7
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  app_links: ^7.0.0
  gallery_saver_plus: ^3.2.9

  # ── Smart Hybrid Address Lookup (May 2026) ──
  http: ^1.2.0
  auto_size_text: ^3.0.0

  # ── DAPP Delivery Screens ──
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  flutter_rating_bar: ^4.0.1
  cloud_functions: ^6.3.3
  # ⚠ WAS ^6.0.0 UNTIL 6 September 2026 — every CI build ever run had failed
  # (all 13 runs, since the very first commit) with:
  #   CocoaPods could not find compatible versions for pod "GoogleMLKit/MLKitCore"
  # mobile_scanner 6.x pins GoogleMLKit/BarcodeScanning (= 7.0.0) on iOS, while
  # google_mlkit_face_detection (below) pins GoogleMLKit/FaceDetection which
  # needs MLKitCore (= 9.0.0) — two exact, incompatible pins on the same
  # underlying pod. mobile_scanner 7.x dropped GoogleMLKit entirely on
  # iOS/macOS in favour of Apple's own Vision API, which removes the
  # conflicting pin altogether rather than needing it to match by luck.
  # Code using this package (active_delivery_screen.dart) only touches the
  # stable MobileScannerController/MobileScanner/onDetect/BarcodeCapture API,
  # unchanged across this bump — nothing else needed to change.
  mobile_scanner: ^7.0.0
  firebase_database: ^12.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/virtual_card.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/logo/virtual_card.png"
  adaptive_icon_foreground: "assets/logo/virtual_card.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/intro/
    - assets/logo/
    - assets/logo/business_code.png
    - assets/delivery/

  # ⚠ REMOVED 6 September 2026 — was:
  #   fonts:
  #     - family: Helvetica
  #       fonts:
  #         - asset: assets
  # "asset: assets" points at a folder, not a font file — invalid, and it's
  # what broke every CI archive after the pod install conflict was fixed
  # ("unable to locate asset entry in pubspec.yaml: assets"). Nothing in the
  # app references fontFamily: 'Helvetica' (checked lib/ — the real theme
  # uses 'Inter', declared nowhere near this block), so this was dead,
  # broken config rather than something to repair. Real Helvetica .ttf files
  # still sit in assets/fonts/ if a real need for this ever comes up —
  # they were just never wired to a valid pubspec entry.