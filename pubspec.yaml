name: goouts_drapp
description: GoOuts food delivery driver app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  firebase_storage: ^13.2.0
  provider: ^6.1.5+1
  go_router: ^17.1.0
  image_picker: ^1.2.1
  google_mlkit_face_detection: ^0.13.2
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  app_links: ^7.0.0
  gallery_saver_plus: ^3.2.9

  # ── Smart Hybrid Address Lookup (May 2026) ──
  http: ^1.2.0
  auto_size_text: ^3.0.0

  # ── DAPP Delivery Screens ──
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  flutter_rating_bar: ^4.0.1
  cloud_functions: ^6.3.3
  mobile_scanner: ^6.0.0
  firebase_database: ^12.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/virtual_card.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/logo/virtual_card.png"
  adaptive_icon_foreground: "assets/logo/virtual_card.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/intro/
    - assets/logo/
    - assets/logo/business_code.png
    - assets/delivery/

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets